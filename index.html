<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de numération — outil interactif</title>
<style>
:root{
  --panel:#f8f6f1;
  --card:#fffdf9;
  --ink:#202733;
  --muted:#66717e;
  --cyan:#137f8e;
  --cyan2:#0aa4a6;
  --cyan-soft:#e8f6f5;
  --line:#d8d4cb;
  --comma:#d77812;
  --purple:#8057c8;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 10%,rgba(10,164,166,.08),transparent 23%),
    radial-gradient(circle at 90% 12%,rgba(128,87,200,.06),transparent 21%),
    linear-gradient(145deg,#e3e7e9,#f1f2f3);
  padding:16px;
}
.shell{
  width:min(1600px,100%);
  margin:0 auto;
  background:var(--panel);
  border:1px solid rgba(255,255,255,.7);
  border-radius:28px;
  box-shadow:0 22px 55px rgba(49,58,67,.14);
  overflow:hidden;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  padding:14px 20px;
  background:
    linear-gradient(90deg,rgba(10,164,166,.10),rgba(128,87,200,.06)),
    var(--card);
  border-bottom:1px solid #e4dfd7;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:46px;height:46px;border-radius:14px;
  display:grid;place-items:center;
  color:#fff;font-weight:950;font-size:1.2rem;
  background:linear-gradient(145deg,var(--cyan2),var(--cyan));
  box-shadow:0 6px 15px rgba(19,127,142,.22);
}
h1{font-size:clamp(1.2rem,2vw,1.65rem);margin:0}
.header-actions{display:flex;gap:9px;flex-wrap:wrap}
button{
  font:inherit;font-weight:850;border:0;border-radius:13px;
  min-height:44px;padding:9px 15px;cursor:pointer;
  transition:.14s ease;touch-action:manipulation;
}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(1px)}
.secondary{background:#ebe8e2;color:#46525e;border:1px solid #d9d4cb}
.primary{
  background:linear-gradient(135deg,var(--cyan2),var(--cyan));
  color:#fff;box-shadow:0 6px 14px rgba(19,127,142,.18);
}
main{padding:18px}
.workspace{
  display:grid;
  grid-template-columns:minmax(0,1fr) 270px;
  gap:18px;
  align-items:start;
}
.workspace.keypad-hidden{grid-template-columns:1fr}
.board-pane{min-width:0}
.intro{
  text-align:center;
  max-width:1000px;
  margin:0 auto 15px;
  color:var(--muted);
  font-weight:750;
  line-height:1.45;
}
.intro strong{color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:14px}
.number-row{
  display:grid;
  grid-template-columns:290px minmax(0,1fr);
  gap:15px;
  align-items:center;
  border:2px solid #dedad2;
  border-radius:20px;
  background:var(--card);
  padding:14px;
  box-shadow:0 8px 18px rgba(35,43,50,.05);
}
.calc-panel{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.calc-label{
  font-size:.78rem;
  font-weight:900;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.06em;
}
.calc-input{
  width:100%;
  min-height:64px;
  border:2px solid #cbc7bf;
  border-radius:14px;
  background:#fff;
  padding:8px 12px;
  color:var(--ink);
  font-size:1.25rem;
  font-weight:900;
  outline:none;
}
.calc-input:focus,.calc-input.active{
  border-color:var(--purple);
  box-shadow:0 0 0 4px rgba(128,87,200,.10);
  background:#fdfbff;
}
.row-board-wrap{min-width:0;overflow-x:auto;padding:3px 3px 6px}
.board{
  --cell:clamp(56px,4vw,65px);
  display:grid;
  grid-template-columns:repeat(12,var(--cell));
  width:max-content;
  margin:0 auto;
}
.digit-cell{
  width:var(--cell);height:70px;
  display:grid;place-items:center;
  border-top:3px solid #c7c4bd;
  border-bottom:3px solid #c7c4bd;
  border-right:1px solid #d4d0c8;
  background:#fff;
  font-size:2rem;font-weight:950;
  cursor:pointer;position:relative;
  user-select:none;transition:.12s ease;
}
.digit-cell:first-child{border-left:3px solid #c7c4bd;border-radius:14px 0 0 14px}
.digit-cell:last-child{border-right:3px solid #c7c4bd;border-radius:0 14px 14px 0}
.digit-cell:hover{background:#f6fbfb}
.digit-cell.active{
  background:#effafa;
  box-shadow:inset 0 0 0 4px rgba(10,164,166,.32);
  z-index:2;
}
.digit-cell.comma-boundary::after{
  content:"";
  position:absolute;right:-4px;top:-3px;bottom:-3px;
  width:6px;border-radius:5px;background:#52616d;
  z-index:4;pointer-events:none;
}
.comma-row{
  --cell:clamp(56px,4vw,65px);
  display:grid;
  grid-template-columns:repeat(11,var(--cell));
  width:max-content;
  margin:-7px auto 0;
  touch-action:none;
  user-select:none;
}
.comma-slot{
  width:var(--cell);height:42px;
  display:grid;place-items:center;
  position:relative;touch-action:none;
}
.comma-slot::before{
  content:"";position:absolute;
  width:32px;height:33px;
  border:2px dashed #d9a95e;border-radius:9px;background:#fff5df;
}
.comma-slot.selected::before{
  border-style:solid;border-color:var(--comma);background:#ffe4b0;
  box-shadow:0 5px 13px rgba(215,120,18,.18);
}
.comma{
  position:relative;z-index:3;
  width:42px;height:42px;
  display:grid;place-items:center;
  color:#a75d0c;font-size:1.8rem;font-weight:950;
  transform:translateY(-3px);
  cursor:grab;touch-action:none;
}
.comma-row.dragging .comma{cursor:grabbing}
.comma-ghost{
  position:relative;z-index:2;
  color:#a75d0c;opacity:.42;
  font-size:1.55rem;font-weight:950;
  transform:translateY(-3px);
  pointer-events:none;
}
.keypad-panel{
  position:sticky;top:12px;
  padding:14px;
  border-radius:20px;
  border:2px solid #d8d4cc;
  background:#f9f8f5;
  box-shadow:0 10px 22px rgba(47,56,63,.08);
}
.keypad-panel.hidden{display:none}
.keypad-panel h2{margin:0 0 5px;text-align:center;font-size:1.05rem}
.keypad-tip{
  min-height:36px;margin:0 0 9px;text-align:center;
  color:var(--muted);font-size:.8rem;font-weight:750;line-height:1.3;
}
.keypad-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.key{
  min-height:56px;padding:6px;
  border:2px solid #d6d3cd;border-radius:14px;
  background:#fff;color:var(--ink);
  font-size:1.4rem;font-weight:950;
  box-shadow:0 4px 0 #d6d3cd;
}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #d6d3cd}
.key.symbol{
  background:#f3edfb;
  border-color:#cbbbe7;
  color:#6740ad;
}
.key.space-key{grid-column:span 2;font-size:1rem}
.key.operator{
  background:#e8f6f5;
  border-color:#9bcfd0;
  color:#126f79;
  box-shadow:0 4px 0 #b9dada;
}
.key.wide{grid-column:span 3;min-height:44px;font-size:.9rem}
.key.clear{background:#fff7f7;color:#a93643;border-color:#e5c3c7}
.footer-note{
  margin-top:14px;padding:10px 13px;
  border-radius:14px;border:1px solid #dfdbd3;
  background:#f5f3ee;color:#68727d;
  font-size:.84rem;line-height:1.45;text-align:center;
}
@media(max-width:1150px){
  .number-row{grid-template-columns:250px minmax(0,1fr)}
}
@media(max-width:1180px){
  .workspace{grid-template-columns:1fr}
  .keypad-panel{position:static;max-width:430px;width:100%;margin:0 auto}
}
@media(max-width:760px){
  body{padding:7px}
  .shell{border-radius:17px}
  header,main{padding-left:11px;padding-right:11px}
  .number-row{grid-template-columns:1fr}
  .calc-panel{max-width:100%}
  .board{--cell:56px}
  .comma-row{--cell:56px}
  .digit-cell{height:62px;font-size:1.75rem}
}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="logo">10</div>
      <h1>Tableau de numération — outil libre</h1>
    </div>
    <div class="header-actions">
      <button class="secondary" id="toggleKeypadBtn">Masquer le pavé</button>
      <button class="primary" id="resetBtn">Tout effacer</button>
    </div>
  </header>

  <main>
    <div class="workspace" id="workspace">
      <section class="board-pane">
        <div class="rows" id="rows"></div>

        <div class="footer-note">
          Dans la zone « calcul », le pavé permet aussi d’écrire <strong>x</strong>, <strong>:</strong>, <strong>=</strong>, la <strong>virgule</strong> et un <strong>espace</strong>.
          Ces touches spéciales n’agissent pas dans les cases de numération.
        </div>
      </section>

      <aside class="keypad-panel" id="keypadPanel">
        <h2>Pavé numérique</h2>
        <div class="keypad-tip" id="keypadTip">Sélectionne une case ou une zone « calcul ».</div>
        <div class="keypad-grid" id="keypad">
          <button class="key" data-key="7">7</button>
          <button class="key" data-key="8">8</button>
          <button class="key" data-key="9">9</button>
          <button class="key" data-key="4">4</button>
          <button class="key" data-key="5">5</button>
          <button class="key" data-key="6">6</button>
          <button class="key" data-key="1">1</button>
          <button class="key" data-key="2">2</button>
          <button class="key" data-key="3">3</button>
          <button class="key" data-key="backspace">⌫</button>
          <button class="key" data-key="0">0</button>
          <button class="key" data-key="right">→</button>
          <button class="key symbol" data-key=",">,</button>
          <button class="key symbol space-key" data-key="space">Espace</button>
          <button class="key operator" data-key="x">x</button>
          <button class="key operator" data-key=":">:</button>
          <button class="key operator" data-key="=">=</button>
          <button class="key wide clear" data-key="clear">Effacer la sélection</button>
        </div>
      </aside>
    </div>
  </main>
</div>

<script>
(() => {
"use strict";

const ROW_COUNT=3;
const CELL_COUNT=12;

const rowsEl=document.getElementById("rows");
const keypad=document.getElementById("keypad");
const keypadPanel=document.getElementById("keypadPanel");
const workspace=document.getElementById("workspace");
const toggleKeypadBtn=document.getElementById("toggleKeypadBtn");
const keypadTip=document.getElementById("keypadTip");

const rows=Array.from({length:ROW_COUNT},()=>({
  cells:Array(CELL_COUNT).fill(""),
  activeCell:null,
  commaSlot:5,
  originalCommaSlot:5,
  calcText:""
}));

let activeTarget={type:null,row:null};

function rowMarkup(rowIndex){
  return `
    <article class="number-row" data-row="${rowIndex}">
      <div class="calc-panel">
        <label class="calc-label" for="calc-${rowIndex}">Calcul / réponse</label>
        <input id="calc-${rowIndex}" class="calc-input" data-calc="${rowIndex}"
               type="text" autocomplete="off">
      </div>
      <div class="row-board-wrap">
        <div class="board" data-board="${rowIndex}"></div>
        <div class="comma-row" data-comma-row="${rowIndex}"></div>
      </div>
    </article>
  `;
}

rowsEl.innerHTML=Array.from({length:ROW_COUNT},(_,i)=>rowMarkup(i)).join("");

function getBoard(rowIndex){
  return document.querySelector(`[data-board="${rowIndex}"]`);
}
function getCommaRow(rowIndex){
  return document.querySelector(`[data-comma-row="${rowIndex}"]`);
}
function getCalcInput(rowIndex){
  return document.querySelector(`[data-calc="${rowIndex}"]`);
}
function updateKeypadTip(){
  if(activeTarget.type==="calc"){
    keypadTip.textContent=`Ligne ${activeTarget.row+1} · zone calcul : chiffres, x, :, =, virgule et espace`;
  }else if(activeTarget.type==="cell"){
    keypadTip.textContent=`Ligne ${activeTarget.row+1} · case ${rows[activeTarget.row].activeCell+1}`;
  }else{
    keypadTip.textContent="Sélectionne une case ou une zone « calcul ».";
  }
}

function renderBoard(rowIndex){
  const state=rows[rowIndex];
  const board=getBoard(rowIndex);
  board.innerHTML="";

  for(let i=0;i<CELL_COUNT;i++){
    const cell=document.createElement("div");
    cell.className="digit-cell";
    if(activeTarget.type==="cell" && activeTarget.row===rowIndex && state.activeCell===i){
      cell.classList.add("active");
    }
    if(i===state.commaSlot) cell.classList.add("comma-boundary");

    cell.dataset.index=i;
    cell.textContent=state.cells[i];
    cell.tabIndex=0;
    cell.setAttribute("role","button");

    cell.addEventListener("click",()=>{
      activeTarget={type:"cell",row:rowIndex};
      state.activeCell=i;

      // Clic direct : vide -> 0 ; 0 -> vide ; autre chiffre -> sélection seulement.
      if(state.cells[i]===""){
        state.cells[i]="0";
      }else if(state.cells[i]==="0"){
        state.cells[i]="";
      }

      renderBoard(rowIndex);
      updateKeypadTip();
    });

    board.appendChild(cell);
  }
}

function renderComma(rowIndex){
  const state=rows[rowIndex];
  const commaRow=getCommaRow(rowIndex);
  commaRow.innerHTML="";

  for(let i=0;i<CELL_COUNT-1;i++){
    const slot=document.createElement("div");
    slot.className="comma-slot"+(i===state.commaSlot?" selected":"");
    slot.dataset.slot=i;

    if(i===state.originalCommaSlot && i!==state.commaSlot){
      const ghost=document.createElement("span");
      ghost.className="comma-ghost";
      ghost.textContent=",";
      slot.appendChild(ghost);
    }

    if(i===state.commaSlot){
      const comma=document.createElement("span");
      comma.className="comma";
      comma.textContent=",";
      comma.setAttribute("title","Maintiens et fais glisser la virgule");
      slot.appendChild(comma);
    }

    commaRow.appendChild(slot);
  }
}

function renderRow(rowIndex){
  renderBoard(rowIndex);
  renderComma(rowIndex);
}

function selectCell(rowIndex,index,focus=false){
  const state=rows[rowIndex];
  state.activeCell=Math.max(0,Math.min(CELL_COUNT-1,index));
  activeTarget={type:"cell",row:rowIndex};
  renderBoard(rowIndex);
  updateKeypadTip();

  if(focus){
    requestAnimationFrame(()=>{
      getBoard(rowIndex).children[state.activeCell]?.focus({preventScroll:true});
    });
  }
}

function putDigit(digit){
  if(activeTarget.type==="calc"){
    const input=getCalcInput(activeTarget.row);
    insertIntoCalc(input,digit);
    return;
  }

  if(activeTarget.type!=="cell"){
    selectCell(0,0,false);
  }

  const rowIndex=activeTarget.row;
  const state=rows[rowIndex];
  if(state.activeCell===null) state.activeCell=0;

  state.cells[state.activeCell]=digit;

  if(state.activeCell<CELL_COUNT-1){
    state.activeCell++;
  }

  renderBoard(rowIndex);
  updateKeypadTip();
}

function eraseCell(){
  if(activeTarget.type!=="cell") return;
  const state=rows[activeTarget.row];
  if(state.activeCell===null) return;
  state.cells[state.activeCell]="";
  renderBoard(activeTarget.row);
}

function moveCell(delta){
  if(activeTarget.type!=="cell"){
    selectCell(0,delta>0?0:CELL_COUNT-1,true);
    return;
  }
  const state=rows[activeTarget.row];
  const current=state.activeCell ?? 0;
  selectCell(activeTarget.row,current+delta,true);
}

function backspaceCell(){
  if(activeTarget.type!=="cell") return;
  const state=rows[activeTarget.row];
  if(state.activeCell===null) return;

  if(state.cells[state.activeCell]!==""){
    state.cells[state.activeCell]="";
  }else if(state.activeCell>0){
    state.activeCell--;
    state.cells[state.activeCell]="";
  }
  renderBoard(activeTarget.row);
  updateKeypadTip();
}

function insertIntoCalc(input,text){
  const start=input.selectionStart ?? input.value.length;
  const end=input.selectionEnd ?? start;
  input.value=input.value.slice(0,start)+text+input.value.slice(end);
  rows[Number(input.dataset.calc)].calcText=input.value;
  const pos=start+text.length;
  input.focus();
  input.setSelectionRange(pos,pos);
}

function backspaceCalc(input){
  const start=input.selectionStart ?? input.value.length;
  const end=input.selectionEnd ?? start;

  if(start!==end){
    input.value=input.value.slice(0,start)+input.value.slice(end);
    input.setSelectionRange(start,start);
  }else if(start>0){
    input.value=input.value.slice(0,start-1)+input.value.slice(start);
    input.setSelectionRange(start-1,start-1);
  }
  rows[Number(input.dataset.calc)].calcText=input.value;
}

function clearActive(){
  if(activeTarget.type==="calc"){
    const input=getCalcInput(activeTarget.row);
    input.value="";
    rows[activeTarget.row].calcText="";
    input.focus();
  }else{
    eraseCell();
  }
}

document.querySelectorAll(".calc-input").forEach(input=>{
  const rowIndex=Number(input.dataset.calc);

  input.addEventListener("focus",()=>{
    activeTarget={type:"calc",row:rowIndex};
    document.querySelectorAll(".calc-input").forEach(el=>el.classList.toggle("active",el===input));
    updateKeypadTip();
  });

  input.addEventListener("input",()=>{
    rows[rowIndex].calcText=input.value;
  });

  input.addEventListener("click",()=>{
    activeTarget={type:"calc",row:rowIndex};
    updateKeypadTip();
  });
});

/* Virgules : chaque ligne est indépendante. */
for(let rowIndex=0;rowIndex<ROW_COUNT;rowIndex++){
  const commaRow=getCommaRow(rowIndex);
  const state=rows[rowIndex];
  let dragging=false;
  let pointerId=null;

  const closestSlot=clientX=>{
    let best=0,bestDist=Infinity;
    [...commaRow.children].forEach((slot,i)=>{
      const r=slot.getBoundingClientRect();
      const d=Math.abs(clientX-(r.left+r.width/2));
      if(d<bestDist){bestDist=d;best=i;}
    });
    return best;
  };

  const refreshComma=()=>{
    [...getBoard(rowIndex).children].forEach((cell,i)=>{
      cell.classList.toggle("comma-boundary",i===state.commaSlot);
    });

    [...commaRow.children].forEach((slot,i)=>{
      slot.classList.toggle("selected",i===state.commaSlot);
      slot.querySelectorAll(".comma,.comma-ghost").forEach(el=>el.remove());

      if(i===state.originalCommaSlot && i!==state.commaSlot){
        const ghost=document.createElement("span");
        ghost.className="comma-ghost";
        ghost.textContent=",";
        slot.appendChild(ghost);
      }
      if(i===state.commaSlot){
        const comma=document.createElement("span");
        comma.className="comma";
        comma.textContent=",";
        slot.appendChild(comma);
      }
    });
  };

  commaRow.addEventListener("pointerdown",e=>{
    const comma=e.target.closest(".comma");
    if(!comma) return;
    e.preventDefault();
    dragging=true;
    pointerId=e.pointerId;
    commaRow.classList.add("dragging");
    try{commaRow.setPointerCapture?.(e.pointerId)}catch(_){}
  });

  commaRow.addEventListener("pointermove",e=>{
    if(!dragging || e.pointerId!==pointerId) return;
    e.preventDefault();
    const next=closestSlot(e.clientX);
    if(next!==state.commaSlot){
      state.commaSlot=next;
      refreshComma();
    }
  });

  const finish=e=>{
    if(!dragging) return;
    if(e.pointerId!==undefined && e.pointerId!==pointerId) return;
    const oldId=pointerId;
    dragging=false;
    pointerId=null;
    commaRow.classList.remove("dragging");
    try{
      if(oldId!==null && commaRow.hasPointerCapture?.(oldId)){
        commaRow.releasePointerCapture?.(oldId);
      }
    }catch(_){}
  };

  commaRow.addEventListener("pointerup",finish);
  commaRow.addEventListener("pointercancel",finish);
}

/* Clavier physique */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;

  if(activeTarget.type==="calc"){
    // Laisse l'input natif gérer le clavier physique.
    return;
  }

  if(/^[0-9]$/.test(e.key)){
    e.preventDefault();
    putDigit(e.key);
    return;
  }
  if(e.key==="ArrowRight"){
    e.preventDefault();
    moveCell(1);
    return;
  }
  if(e.key==="ArrowLeft"){
    e.preventDefault();
    moveCell(-1);
    return;
  }
  if(e.key==="Backspace"){
    e.preventDefault();
    backspaceCell();
    return;
  }
  if(e.key==="Delete"){
    e.preventDefault();
    eraseCell();
  }
});

/* Pavé tactile */
keypad.addEventListener("pointerdown",e=>{
  if(e.target.closest("[data-key]")) e.preventDefault();
});

keypad.addEventListener("click",e=>{
  const btn=e.target.closest("[data-key]");
  if(!btn) return;

  const key=btn.dataset.key;

  if(/^[0-9]$/.test(key)){
    putDigit(key);
    return;
  }

  if(key==="x" || key===":" || key==="=" || key==="," || key==="space"){
    if(activeTarget.type==="calc"){
      const input=getCalcInput(activeTarget.row);
      insertIntoCalc(input,key==="space" ? " " : key);
    }
    return;
  }

  if(key==="backspace"){
    if(activeTarget.type==="calc"){
      backspaceCalc(getCalcInput(activeTarget.row));
    }else{
      backspaceCell();
    }
    return;
  }

  if(key==="right"){
    if(activeTarget.type==="calc"){
      const input=getCalcInput(activeTarget.row);
      const pos=Math.min(input.value.length,(input.selectionStart ?? 0)+1);
      input.focus();
      input.setSelectionRange(pos,pos);
    }else{
      moveCell(1);
    }
    return;
  }

  if(key==="clear"){
    clearActive();
  }
});

document.getElementById("resetBtn").addEventListener("click",()=>{
  rows.forEach((state,rowIndex)=>{
    state.cells.fill("");
    state.activeCell=null;
    state.commaSlot=5;
    state.originalCommaSlot=5;
    state.calcText="";
    getCalcInput(rowIndex).value="";
  });
  activeTarget={type:null,row:null};
  document.querySelectorAll(".calc-input").forEach(el=>el.classList.remove("active"));
  for(let i=0;i<ROW_COUNT;i++) renderRow(i);
  updateKeypadTip();
});

toggleKeypadBtn.addEventListener("click",()=>{
  const hidden=keypadPanel.classList.toggle("hidden");
  workspace.classList.toggle("keypad-hidden",hidden);
  toggleKeypadBtn.textContent=hidden ? "Afficher le pavé" : "Masquer le pavé";
});

for(let i=0;i<ROW_COUNT;i++) renderRow(i);
updateKeypadTip();

})();
</script>
</body>
</html>
